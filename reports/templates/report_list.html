{% extends 'base.html' %}
{% load l10n %}

{% block title %}GAW Finance - Relatórios{% endblock %}

{% block content %}

<div class="card page-title-box rounded-0">
  <div class="d-flex align-items-sm-center flex-sm-row flex-column gap-2">
    <div class="flex-grow-1">
      <h4 class="font-18 fw-semibold mb-0">Relatórios</h4>
    </div>
    <div class="text-end">
      <ol class="breadcrumb m-0 py-0">
        <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">GAW Finance</a></li>
        <li class="breadcrumb-item active">Relatórios</li>
      </ol>
    </div>
  </div>
</div>

<div class="row mt-3 justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="avatar-lg rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center mx-auto mb-3">
            <i data-lucide="file-text" class="font-30 text-primary"></i>
          </div>
          <h4 class="fw-semibold">Relatório Personalizado</h4>
          <p class="text-muted font-14">Selecione as informações que deseja incluir no relatório e baixe o PDF.</p>
        </div>

        <form method="get" action="{% url 'report_custom' %}" id="report-form">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Mês</label>
              <select name="month" class="form-select form-select-sm">
                <option value="">Todos os meses</option>
                {% for m in months_list %}
                <option value="{{ m.month|unlocalize }}">{{ m.display }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Ano</label>
              <select name="year" class="form-select form-select-sm">
                <option value="">Todos os anos</option>
                {% for y in years_list %}
                <option value="{{ y|unlocalize }}">{{ y|unlocalize }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <label class="form-label fw-semibold d-block mb-2">Informações do Relatório</label>
          <div class="row mb-4">
            <div class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sections" value="summary" id="sec-summary" checked>
                <label class="form-check-label" for="sec-summary">Resumo (Entradas / Saídas / Saldo)</label>
              </div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sections" value="inflows" id="sec-inflows" checked>
                <label class="form-check-label" for="sec-inflows">Detalhamento de Entradas</label>
              </div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sections" value="outflows" id="sec-outflows" checked>
                <label class="form-check-label" for="sec-outflows">Detalhamento de Saídas</label>
              </div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sections" value="by_category" id="sec-category" checked>
                <label class="form-check-label" for="sec-category">Despesas por Categoria</label>
              </div>
            </div>
            <div class="col-md-6 mb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sections" value="investments" id="sec-investments" checked>
                <label class="form-check-label" for="sec-investments">Investimentos</label>
              </div>
            </div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary">
              <i data-lucide="download" class="font-16 me-1"></i> Baixar PDF
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
