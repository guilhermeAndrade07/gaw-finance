services:
  app:
    build: .
    env_file: .env
    environment:
      - DJANGO_ENV=dev
      - DATABASE_URL=postgres://postgres:postgres@db:5432/gaw_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://gaw_app:gaw_dev@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - media_data:/gaw-finance/media
      - static_data:/gaw-finance/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=gaw_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaw_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      - RABBITMQ_DEFAULT_USER=gaw_app
      - RABBITMQ_DEFAULT_PASS=gaw_dev
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  static_data:
