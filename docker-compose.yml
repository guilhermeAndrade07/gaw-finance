services:
  gaw_web:
    build: .
    env_file:
      - .env
    environment:
      - DJANGO_ENV=docker
    restart: always
    ports:
      - 8000:8000
    volumes:
      - media_data:/gaw-finance/media
      - static_data:/gaw-finance/staticfiles
    depends_on:
      gaw_db:
        condition: service_healthy

  gaw_db:
    image: postgres:16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gaw_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaw_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
  static_data: