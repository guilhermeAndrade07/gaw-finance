{% extends 'base.html' %}
{% block title %}Senha alterada — GAW Finance{% endblock %}

{% block content %}

<div class="row justify-content-center" style="min-height: 60vh;">
  <div class="col-lg-6 align-self-center">
    <div class="card text-center">
      <div class="card-body p-4">
        <div class="rounded-circle bg-success d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
          <iconify-icon icon="mdi:check-decagram" class="text-white font-30"></iconify-icon>
        </div>
        <h4 class="fw-semibold">Senha alterada com sucesso</h4>
        <p class="text-muted mb-4">A nova senha já está ativa. Sessões antigas e tokens JWT anteriores foram invalidados por segurança.</p>
        <div class="d-flex gap-2 justify-content-center">
          <a href="{% url 'account_list' %}" class="btn btn-light">Minha Conta</a>
          <a href="{% url 'dashboard' %}" class="btn btn-primary">Ir ao Dashboard</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
