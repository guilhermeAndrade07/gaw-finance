{% extends 'base.html' %}

{% block title %}GAW Finance - Cadastrar Compra{% endblock %}

{% block content %}

<div class="card page-title-box rounded-0">
  <div class="d-flex align-items-sm-center flex-sm-row flex-column gap-2">
    <div class="flex-grow-1">
      <h4 class="font-18 fw-semibold mb-0">Cadastrar Compra</h4>
    </div>
    <div class="text-end">
      <ol class="breadcrumb m-0 py-0">
        <li class="breadcrumb-item"><a href="{% url 'payment_list' %}">Cartão de Crédito</a></li>
        <li class="breadcrumb-item active">Nova Compra</li>
      </ol>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-header">
    <h4 class="header-title">Nova Compra</h4>
    <p class="card-subtitle">Registre uma nova compra no cartão.</p>
  </div>
  <div class="card-body">
    <form method="post" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar Compra</button>
        <a href="{% url 'payment_list' %}" class="btn btn-light">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
    (function () {
        document.querySelectorAll('.js-date-mask').forEach((input) => {
            input.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').slice(0, 8);
                if (v.length > 4) {
                    v = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
                } else if (v.length > 2) {
                    v = v.slice(0, 2) + '/' + v.slice(2);
                }
                e.target.value = v;
            });
        });
    })();
</script>

{% endblock %}
