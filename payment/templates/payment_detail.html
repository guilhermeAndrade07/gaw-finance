{% extends 'base.html' %}

{% block content %}

    <div class="container mt-4">
        <h3 class="display-6"> Detalhes do Pagamento</h3>

        <div class="card">
            <div class="card-body">
                <h3 class="card-title">{{object.name}}</h3>
                <p class="card-text">{{ object.description }}</p>
                <p class="card-text">Categoria: {{ object.category }}</p>
                <p class="card-text">Data de pagamento: <strong>{{ object.date_payment }}</strong></p>
                <p class="card-text">Valor: <strong>R$ {{ object.value }}</strong></p>
            </div>
        </div>
        <a href="{% url 'payment_list' %}" class="btn btn-secondary mt-3">Voltar para a lista de Pagamentos</a>
    </div>

{% endblock %}
