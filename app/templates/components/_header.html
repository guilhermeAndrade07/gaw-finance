<header class="app-topbar">
  <div class="page-container topbar-menu">
    <div class="d-flex align-items-center gap-1">
      <a href="{% url 'dashboard' %}" class="logo">
        <span class="logo-lg">
          <span class="brand-text fw-bold fs-4">
            <iconify-icon icon="mdi:bank" class="font-22 me-1"></iconify-icon>GAW Finance
          </span>
        </span>
        <span class="logo-sm">
          <span class="brand-text fw-bold fs-5">
            <iconify-icon icon="mdi:bank" class="font-22"></iconify-icon>
          </span>
        </span>
      </a>
      <button class="sidenav-toggle-button px-2" type="button">
        <i data-lucide="menu" class="font-22"></i>
      </button>
    </div>
    <div class="d-flex align-items-center gap-1">
      <div class="topbar-item">
        <button class="topbar-link" id="light-dark-mode" type="button">
          <i data-lucide="moon" class="font-22 light-mode"></i>
          <i data-lucide="sun" class="font-22 dark-mode"></i>
        </button>
      </div>
      <div class="topbar-item nav-user">
        <div class="dropdown">
          <a class="topbar-link dropdown-toggle drop-arrow-none px-0" data-bs-toggle="dropdown" type="button">
            <span class="avatar avatar-sm">
              <span class="avatar-title bg-primary rounded-circle">
                <iconify-icon icon="mdi:account" class="font-20 text-white"></iconify-icon>
              </span>
            </span>
            <span class="d-lg-flex flex-column gap-1 d-none">
              <span class="my-0">{{ user.first_name|default:user.username }}</span>
            </span>
            <i data-lucide="chevron-down" class="font-16 ms-1 d-none d-lg-inline"></i>
          </a>
          <div class="dropdown-menu dropdown-menu-end">
            <div class="dropdown-header noti-title">
              <h6 class="text-overflow m-0">Bem-vindo!</h6>
            </div>
            <a href="{% url 'dashboard' %}" class="dropdown-item">
              <iconify-icon icon="mdi:chart-line" class="me-1 font-17 align-middle"></iconify-icon>
              <span class="align-middle">Dashboard</span>
            </a>
            <div class="dropdown-divider"></div>
            <form action="{% url 'logout' %}" method="post" id="logout-form">
              {% csrf_token %}
              <button type="submit" class="dropdown-item fw-semibold text-danger border-0 bg-transparent w-100 text-start">
                <iconify-icon icon="mdi:logout" class="me-1 font-17 align-middle"></iconify-icon>
                <span class="align-middle">Sair</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
