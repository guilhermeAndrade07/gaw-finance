{% extends "base.html" %}

{% block title %}
GAW Finance - Banks
{% endblock%}

{% block content %}

<div class="row">
    <h1>Bancos</h1>
</div>


<div class="row mt-4 mb-3">
    
    <div class="col-md-6">
        <form method="get" action="{% url 'bank_list'  %}">
            <div class="input-group">
                <input type="text" class="form-control" name="name" placeholder="Nome" value="{{request.GET.name}}">
                <button  type="submit" class="btn btn-success">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>
    </div>
    <div class="col-md-6">
        <a href="{% url 'bank_create' %}" class="btn btn-success float-end">
            <i class="bi bi-plus"></i> Novo Banco
        </a>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="thead-dark">
            <tr>
                <th>Nome</th>
                <th>Tipo de conta</th>
                <th>Agência</th>
                <th>Conta</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for bank in banks %}
            <tr>
                <td>{{ bank.name }}</td>
                <td>{{ bank.account_type }}</td>
                <td>{{ bank.agency }}</td>
                <td>{{ bank.account}}</td>
                <td>
                    <a href="{% url 'bank_detail' bank.id %}" class="btn btn-info btn-sm">
                        <i class="bi bi-eye"></i>
                    </a>
                    
                    <a href="{% url 'bank_update' bank.id %}" class="btn btn-warning btn-sm">
                        <i class="bi bi-pencil"></i>
                    </a>
                    
                    <a href="{% url 'bank_delete' bank.id %}" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
