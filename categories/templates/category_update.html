{% extends 'base.html' %}

{% block title %}GAW Finance - Editar Categoria{% endblock %}

{% block content %}

<div class="card page-title-box rounded-0">
  <div class="d-flex align-items-sm-center flex-sm-row flex-column gap-2">
    <div class="flex-grow-1">
      <h4 class="font-18 fw-semibold mb-0">Editar Categoria</h4>
    </div>
    <div class="text-end">
      <ol class="breadcrumb m-0 py-0">
        <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categorias</a></li>
        <li class="breadcrumb-item active">Editar</li>
      </ol>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-header">
    <h4 class="header-title">Editar Categoria</h4>
    <p class="card-subtitle">Atualize os dados da categoria.</p>
  </div>
  <div class="card-body">
    <form method="post" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar Categoria</button>
        <a href="{% url 'category_list' %}" class="btn btn-light">Cancelar</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
