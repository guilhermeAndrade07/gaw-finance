{% extends 'base.html' %}

{% block title %}GAW Finance - Detalhes da Categoria{% endblock %}

{% block content %}

<div class="card page-title-box rounded-0">
  <div class="d-flex align-items-sm-center flex-sm-row flex-column gap-2">
    <div class="flex-grow-1">
      <h4 class="font-18 fw-semibold mb-0">Detalhes da Categoria</h4>
    </div>
    <div class="text-end">
      <ol class="breadcrumb m-0 py-0">
        <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categorias</a></li>
        <li class="breadcrumb-item active">{{ object.name }}</li>
      </ol>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-header">
    <h4 class="header-title">{{ object.name }}</h4>
  </div>
  <div class="card-body">
    <p class="card-text">{{ object.description }}</p>
  </div>
  <div class="card-footer">
    <a href="{% url 'category_list' %}" class="btn btn-light">Voltar para a lista</a>
  </div>
</div>

{% endblock %}
