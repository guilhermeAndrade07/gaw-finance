services:
  app:
    image: ${APP_IMAGE}
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=gaw_app
      - RABBITMQ_HOST=rabbitmq
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - traefik_public
      - gaw_finance_internal
    volumes:
      - media_data:/gaw-finance/media
      - static_data:/gaw-finance/staticfiles
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=5)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 512
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    secrets:
      - gaw_secret_key
      - gaw_db_password
      - gaw_rabbitmq_password

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/gaw_db_password
    networks:
      - gaw_finance_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 512
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_db_password

  redis:
    image: redis:7-alpine
    networks:
      - gaw_finance_internal
    volumes:
      - redis_data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 256
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      - RABBITMQ_DEFAULT_USER=gaw_app
      - RABBITMQ_DEFAULT_PASS_FILE=/run/secrets/gaw_rabbitmq_password
    networks:
      - gaw_finance_internal
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 512
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_rabbitmq_password

  celery_worker:
    image: ${APP_IMAGE}
    entrypoint: ["./entrypoint-celery.sh"]
    command: celery -A app worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=gaw_app
      - RABBITMQ_HOST=rabbitmq
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - gaw_finance_internal
      - gaw_finance_egress
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app inspect ping --destination celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 512
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_secret_key
      - gaw_db_password
      - gaw_rabbitmq_password

  celery_beat:
    image: ${APP_IMAGE}
    entrypoint: ["./entrypoint-celery.sh"]
    command: celery -A app beat --loglevel=info
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=gaw_app
      - RABBITMQ_HOST=rabbitmq
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - gaw_finance_internal
      - gaw_finance_egress
    stop_grace_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 256
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_secret_key
      - gaw_db_password
      - gaw_rabbitmq_password

  traefik:
    image: traefik:v3
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL}
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    networks:
      - traefik_public
    volumes:
      - letsencrypt_data:/letsencrypt
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/CLOUDFLARE_DNS_API_TOKEN
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 256
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - CLOUDFLARE_DNS_API_TOKEN

networks:
  traefik_public:
    external: true
  gaw_finance_internal:
    external: true
  gaw_finance_egress:
    external: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media_data:
  static_data:
  letsencrypt_data:

secrets:
  gaw_secret_key:
    external: true
  gaw_db_password:
    external: true
  gaw_rabbitmq_password:
    external: true
  CLOUDFLARE_DNS_API_TOKEN:
    external: true
