services:
  app:
    image: ghcr.io/guilhermeAndrade07/gaw-finance:latest
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - traefik_public
      - gaw_finance_internal
    volumes:
      - media_data:/gaw-finance/media
      - static_data:/gaw-finance/staticfiles
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.gaw_finance_app.rule=Host(`${DOMAIN}`, `www.${DOMAIN}`)
        - traefik.http.routers.gaw_finance_app.entrypoints=websecure
        - traefik.http.routers.gaw_finance_app.tls=true
        - traefik.http.routers.gaw_finance_app.tls.certresolver=letsencrypt
        - traefik.http.routers.gaw_finance_app.tls.domains[0].main=${DOMAIN}
        - traefik.http.routers.gaw_finance_app.tls.domains[0].sans=*.${DOMAIN}
        - traefik.http.services.gaw_finance_app.loadbalancer.server.port=8000
        - traefik.http.services.gaw_finance_app.loadbalancer.healthcheck.path=/health/
        - traefik.http.services.gaw_finance_app.loadbalancer.healthcheck.interval=30s
    secrets:
      - gaw_secret_key
      - gaw_db_password

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/gaw_db_password
    networks:
      - gaw_finance_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    secrets:
      - gaw_db_password

  redis:
    image: redis:7-alpine
    networks:
      - gaw_finance_internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  rabbitmq:
    image: rabbitmq:4-management
    networks:
      - gaw_finance_internal
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  celery_worker:
    image: ghcr.io/guilhermeAndrade07/gaw-finance:latest
    entrypoint: ["./entrypoint-celery.sh"]
    command: celery -A app worker --loglevel=info --concurrency=2
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - gaw_finance_internal
      - gaw_finance_egress
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_secret_key
      - gaw_db_password

  celery_beat:
    image: ghcr.io/guilhermeAndrade07/gaw-finance:latest
    entrypoint: ["./entrypoint-celery.sh"]
    command: celery -A app beat --loglevel=info
    environment:
      - DJANGO_ENV=${DJANGO_ENV}
      - DEBUG=${DEBUG}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
    networks:
      - gaw_finance_internal
      - gaw_finance_egress
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
    secrets:
      - gaw_secret_key
      - gaw_db_password

  traefik:
    image: traefik:v3
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL}
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    networks:
      - traefik_public
    volumes:
      - letsencrypt_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/CLOUDFLARE_DNS_API_TOKEN
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    secrets:
      - CLOUDFLARE_DNS_API_TOKEN

networks:
  traefik_public:
    external: true
  gaw_finance_internal:
    driver: overlay
    internal: true
  gaw_finance_egress:
    driver: overlay

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media_data:
  static_data:
  letsencrypt_data:

secrets:
  gaw_secret_key:
    external: true
  gaw_db_password:
    external: true
  CLOUDFLARE_DNS_API_TOKEN:
    external: true
